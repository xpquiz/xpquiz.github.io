<div class="window window_loading" *ngIf="!this.showQuestion">
  <app-window-title-bar iconPath="time-rush-rules.png" [title]="this.getLoadingWindowBarTitle()"></app-window-title-bar>
  <div class="window-body window_loading_body">
    <div class="window_loading_body_image">
      <img [ngSrc]="this.getLoadingWindowIcon()"
           alt="" height="40" width="40"/>
    </div>
    <div class="window_loading_body_loading">
      <label class="window_loading_body_loading_title">{{ this.getLoadingWindowDescription() }}</label>
      <progress class="window_loading_body_loading_progress" [max]="this.loadingProgressBarMax" [value]="this.loadingProgressBar"></progress>
    </div>
  </div>
</div>


<div class="window window_question" *ngIf="this.showQuestion">
  <app-window-title-bar iconPath="question.png" [title]="this.getQuestionWindowBarTitle()"></app-window-title-bar>
  <div class="window-body window_question_body">
    <div class="window_question_body">
      <label class="window_question_body_title" [innerHTML]="this.currentQuestion!.question"></label>
      <label class="window_question_body_points">{{ this.getCurrentQuestionPoints() }}</label>
      <div class="window_question_body_list">
        <ng-container *ngFor="let answer of this.currentQuestion!.answers">
          <button class="window_question_body_list_option-button" (click)="this.onClickAnswer(answer)">
            {{ answer }}
          </button>
        </ng-container>
      </div>

      <div class="window_question_body_time-remaining">
        <ul class="tree-view">
          <label>{{this.timeRemainingProgressBar}} seconds remaining...</label>

          <progress [max]="this.timeRemainingProgressBarMax" [value]="this.timeRemainingProgressBar"></progress>
        </ul>
      </div>
    </div>
  </div>
</div>
